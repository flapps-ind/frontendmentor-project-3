<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Social links profile</title>


</head>
<body>
  <div class="container">
    <img src="assets/images/avatar-jessica.jpeg" alt="profile-pic">
    <p class="name">Jessica Randall</p>
    <p class="address">London, United Kingdom</p>
    <p class="desc">"Front-end developer and avid reader."</p>
    <button class="button" onclick="goToWebsite();">GitHub</button>
    <button class="button">Frontend Mentor</button>
    <button class="button">LinkedIn</button>
    <button class="button">Twitter</button>
    <button class="button">Instagram</button>
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Mahfooz</a>.
  </div>
  <script>
    function goToWebsite () {
      window.open('https://www.youtube.com', '_blank');
    }
  </script>
</body>
</html>
